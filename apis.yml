description: Massive Science is a science communication platform and media company that
  publishes stories, explainers, lab notes, and reports about current research, written
  and edited by working scientists. It runs the Massive Science Consortium, a training
  network of scientist-writers, alongside editorial content, newsletters, a community
  discussion forum, and a shop. Surfaced as a portfolio company of Bloomberg Beta and
  added to the API Evangelist network; enrichment finds no public API, developer portal,
  or machine-readable interface beyond a public RSS feed.
